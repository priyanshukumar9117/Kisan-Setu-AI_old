# Render Infrastructure as Code Configuration
# Reference: https://render.com/docs/infrastructure-as-code

services:
  - type: web
    name: kisan-setu-api
    env: python
    plan: starter
    buildCommand: |
      pip install --upgrade pip && \
      pip install -r requirements/production-minimal.txt && \
      cd backend && \
      python manage.py migrate && \
      python manage.py collectstatic --noinput --ignore=node_modules
    startCommand: cd backend && gunicorn django_project.wsgi:application --bind 0.0.0.0:8000 --workers 1 --worker-class sync --timeout 60 --max-requests 1000 --max-requests-jitter 50
    envVars:
      - fromGroup: kisan-setu-env
    disk:
      name: kisan-setu-data
      mountPath: /data
      sizeGB: 10

  # Optional: PostgreSQL Database
  - type: pserv
    name: kisan-setu-db
    env: postgresql
    plan: starter
    ipAllowList: []
    envVars:
      - key: POSTGRES_USER
        value: postgres
      - key: POSTGRES_DB
        value: kisan_setu

  # Optional: Telegram Bot (Background Job)
  - type: background
    name: kisan-setu-bot
    env: python
    plan: starter
    buildCommand: pip install -r requirements/production-minimal.txt
    startCommand: python telegram_bot/bot.py
    envVars:
      - fromGroup: kisan-setu-env

envVarGroups:
  - name: kisan-setu-env
    envVars:
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: ENVIRONMENT
        value: "production"
      - key: ALLOWED_HOSTS
        value: "kisan-setu-api.onrender.com,localhost,127.0.0.1"
      - key: DB_ENGINE
        value: "django.db.backends.postgresql"
      - key: SENTRY_DSN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DATA_GOV_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "https://kisan-setu-ai.vercel.app,http://localhost:3000"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
